spring:
  application:
    name: vet-clinic-backend
  datasource:
    url: jdbc:h2:mem:vetclinic;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  booking:
    reservation-ttl: PT10M
    expiry-sweep: PT30S
  jwt:
    # DEVELOPMENT DEFAULT ONLY: override with the APP_JWT_SECRET environment variable (min 32 bytes).
    secret: ${APP_JWT_SECRET:dev-only-change-me-dev-only-change-me-0123456789}
    ttl: PT8H
  cors:
    allowed-origins: http://localhost:3000
